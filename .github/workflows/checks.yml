name: Council checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv
      - run: uv sync --locked --extra dev --python ${{ matrix.python }}
      - run: uv run --locked python -m pytest
      - run: uv run --locked ruff check src tests scripts
      - run: uv run --locked ruff format --check --diff src tests scripts
      - run: uv run --locked council validate
      - run: uv run --locked council claude sync --check
      - run: uv run --locked council dispatch --project council-bootstrap --all --output .council/ci-dispatch.json
      - run: uv run --locked python scripts/check_secrets.py
